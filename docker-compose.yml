version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres_bicoja
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: banco_servicos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_bicoja
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: